plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.beone'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

// Unit tests: no Spring context, no Docker.
tasks.named('test', Test) {
	useJUnitPlatform {
		excludeTags 'integration', 'web'
	}
	// Read by MySqlVersionAlignmentTest; declared so edits re-run the test.
	inputs.file(layout.projectDirectory.file('../docker-compose.yml'))
		.withPathSensitivity(PathSensitivity.NONE)
	// EvaluationFixtureMappingTest가 읽는 파일. fixture가 바뀌면 테스트를 다시 실행하도록 입력으로 선언한다.
	inputs.file(layout.projectDirectory.file('../fixtures/evaluation-cases.json'))
		.withPathSensitivity(PathSensitivity.NONE)
}

// Integration tests: @IntegrationTest (Testcontainers MySQL). Requires Docker.
def integrationTest = tasks.register('integrationTest', Test) {
	description = 'Runs @IntegrationTest tests against a Testcontainers MySQL.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}

// 웹 슬라이스 테스트: @WebSliceTest(@WebMvcTest + MockMvc). DB·Docker 없이 실행한다.
def webTest = tasks.register('webTest', Test) {
	description = 'Runs @WebSliceTest tests against a Spring MVC slice without a database.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'web'
	}
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn integrationTest
	dependsOn webTest
}
